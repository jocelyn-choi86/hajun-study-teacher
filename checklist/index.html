<title>하준이 공부 체크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a single notebook column — week strip on top, the chosen day's checklist below, ticked rows strike through like a planner. */
:root{
  --bg:#f3f6f9; --paper:#ffffff; --ink:#1d2733; --muted:#64748b; --line:#dbe3ec; --accent:#2f6fde; --done:#1f9d6a;
  --kor:#d9485f; --math:#2f6fde; --eng:#1f9d6a; --soc:#c98a12; --sci:#0e8f9e; --etc:#7c6fb0;
  --display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161d; --paper:#18212b; --ink:#e6edf4; --muted:#94a3b8; --line:#2a3644; --accent:#6f9ff0; --done:#45c08d;
  --kor:#f07186; --math:#6f9ff0; --eng:#45c08d; --soc:#e0aa44; --sci:#3fc0cf; --etc:#a89ce0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161d; --paper:#18212b; --ink:#e6edf4; --muted:#94a3b8; --line:#2a3644; --accent:#6f9ff0; --done:#45c08d;
  --kor:#f07186; --math:#6f9ff0; --eng:#45c08d; --soc:#e0aa44; --sci:#3fc0cf; --etc:#a89ce0; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;line-height:1.1;text-wrap:balance}
.weeknav{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
button{font:inherit;color:inherit}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:32px;height:32px;cursor:pointer}
.iconbtn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.day .d{font-family:var(--display);font-size:1.15rem;line-height:1}
.day .n{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.day .bar{width:70%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.day .bar i{display:block;height:100%;background:var(--done)}
.day.today .n{color:var(--accent);font-weight:700}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.sun .d{color:var(--kor)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sheet-head{padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.sheet-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sheet-title h2{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0}
.sum{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.sum b{color:var(--ink)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--done);transition:width .25s}
.events{display:flex;flex-wrap:wrap;gap:6px}
.ev{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0}
li.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line)}
li.task:last-child{border-bottom:0}
li.task input[type=checkbox]{appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;margin:1px 0 0;cursor:pointer;display:grid;place-content:center;background:var(--paper)}
li.task input[type=checkbox]:checked{background:var(--done);border-color:var(--done)}
li.task input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tbody{min-width:0;display:flex;flex-direction:column;gap:2px}
.tline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.02em;color:var(--c);border:1px solid var(--c);border-radius:5px;padding:0 5px;line-height:1.5;flex:none}
.tname{font-weight:500}
.tnote{font-size:.82rem;color:var(--muted)}
.min{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
li.task.done .tname{text-decoration:line-through;text-decoration-color:var(--done);text-decoration-thickness:2px;color:var(--muted)}
.hw{margin-top:6px;width:100%;box-sizing:border-box;border:1px dashed var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:.88rem;background:transparent;color:var(--ink);resize:vertical;min-height:36px}
.hw:focus{border-style:solid;border-color:var(--eng);outline:none}
.group{padding:8px 16px 4px;font-size:.75rem;letter-spacing:.06em;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.rest{padding:28px 16px;text-align:center;color:var(--muted)}
.rest strong{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--ink);margin-bottom:4px}
.status{font-size:.78rem;color:var(--muted);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
@media (max-width:420px){h1{font-size:1.6rem}.day .d{font-size:1rem}li.task{gap:10px;padding:12px}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.topbtns{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--kor);border-color:var(--kor)}
.ed-section{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ed-section label.lbl{font-size:.78rem;letter-spacing:.04em;color:var(--muted)}
.ed-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;box-sizing:border-box}
.inp:focus{outline:none;border-color:var(--accent)}
.inp.num{width:4.5em;font-variant-numeric:tabular-nums}
.inp.grow{flex:1 1 180px}
textarea.inp{width:100%;resize:vertical}
li.edtask{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
li.edtask .ed-row .spacer{flex:1}
.mini{border:1px solid var(--line);background:var(--paper);border-radius:6px;min-width:30px;height:30px;cursor:pointer;font-size:.85rem;padding:0 8px}
.mini:hover{border-color:var(--accent)}
.mini.del{color:var(--kor)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;color:var(--muted)}
.ed-foot{padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.confirm{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--kor)}
.dirty{font-size:.82rem;color:var(--soc)}
</style>

<div class="wrap">
  <header>
    <h1 id="title">하준이 공부 체크</h1>
    <div class="topbtns">
      <div class="weeknav" id="weeknav">
        <button class="iconbtn" id="prevWeek" aria-label="지난주">‹</button>
        <span id="weekLabel"></span>
        <button class="iconbtn" id="nextWeek" aria-label="다음 주">›</button>
      </div>
      <a class="btn" id="modeBtn" href="#edit" hidden>할 일 편집</a>
    </div>
  </header>

  <nav class="days" id="days" aria-label="요일 선택"></nav>

  <section class="sheet" id="sheet" aria-live="polite"></section>

  <div class="legend" id="legend">
    <span style="--c:var(--kor)">국어</span><span style="--c:var(--math)">수학</span><span style="--c:var(--eng)">영어</span>
    <span style="--c:var(--soc)">사회</span><span style="--c:var(--sci)">과학</span><span style="--c:var(--etc)">학교·기본</span>
  </div>
  <p class="status" id="status">불러오는 중…</p>
</div>

<script>
// ---- 주간 계획 (data/weekly-plan.md v3) ----
const C = {국어:"--kor",수학:"--math",영어:"--eng",사회:"--soc",과학:"--sci",학교:"--etc",기본:"--etc",엘리하이:"--etc"};
const t = (id,tag,name,min,note,extra={}) => ({id,tag,name,min,note,...extra});
const DEFAULT_PLAN = {
  mon:{label:"월",cap:60,events:["학교 ~14:30","영어 학원 15:00–18:30"],tasks:[
    t("pilsa","기본","필사 · 한자",10),
    t("calc","수학","연산 20문제",15),
    t("writing","학교","자유글쓰기",20),
    t("words","영어","단어 외우기",15),
  ]},
  tue:{label:"화",cap:180,events:["학교 ~14:30","수영 18:00–19:00"],tasks:[
    t("pilsa","기본","필사 · 한자",10),
    t("ellie","엘리하이","인강 영상: 사회 · 과학 · 중학수학",50),
    t("readlog","학교","두줄 독서록",10),
    t("lit","국어","문학 독해 1개",20,"메가스터디 문학 필수 개념 독해 1"),
    t("calc","수학","연산 (중학연산) 20문제",15),
    t("mmath","수학","중학수학 문제풀이",30,"개념원리 1-1 · 모르는 건 표시해 두기"),
    t("soc","사회","1강 문제 + 코넬노트 + 오답",25,"백점 사회 6-2"),
    t("sci","과학","1강 문제 + 오답",20,"오투 과학 6-2"),
    t("words","영어","단어 외우기",15),
  ]},
  wed:{label:"수",cap:60,events:["학교 ~14:30","수학과외 15:30","국어 다독 17:00","농구 19:30–21:30"],tasks:[
    t("pilsa","기본","필사 · 한자",10),
    t("calc","수학","연산 20문제",15),
    t("enghw","영어","과외 숙제 (금요일 수업)",25,"",{hw:true}),
    t("wtest","영어","단어 TEST",10),
  ]},
  thu:{label:"목",cap:180,events:["학교 ~14:30","수영 18:00–19:00"],tasks:[
    t("pilsa","기본","필사 · 한자",10),
    t("ellie","엘리하이","인강 영상: 사회 · 과학",30),
    t("readlog","학교","두줄 독서록",10),
    t("nonlit","국어","비문학 독해 1개",20,"작 비문학 독해 2"),
    t("m62","수학","6-2 문제풀이 (1장 반)",30,"디딤돌 응용 6-2 · 채점은 엄마·아빠"),
    t("enghw","영어","과외 숙제 (금요일 수업)",30,"",{hw:true}),
    t("words","영어","단어 외우기 + 전날 못 본 단어 TEST",15),
    t("soc","사회","1강 문제 + 코넬노트 + 오답",25,"백점 사회 6-2"),
    t("sci","과학","1강 문제 + 오답",20,"오투 과학 6-2"),
  ]},
  fri:{label:"금",cap:60,events:["학교 ~14:30","영어 16:30–18:30","농구 19:30–21:30"],tasks:[
    t("pilsa","기본","필사 · 한자",10),
    t("calc","수학","연산 20문제",15),
    t("words","영어","단어 외우기",15),
    t("enghw","영어","영어 숙제 마무리 · 오답",20,"영어 수업 전에 끝내기",{hw:true}),
  ]},
  sat:{label:"토",cap:180,events:["고정 일정 없음"],tasks:[
    t("pilsa","기본","필사 · 한자",10),
    t("ellie","엘리하이","인강 영상: 중학수학 · 비교과 국어",35),
    t("mmath","수학","중학수학 문제풀이",30,"개념원리 1-1"),
    t("m62","수학","6-2 문제풀이 (1장 반)",30,"디딤돌 응용 6-2"),
    t("vocab","국어","어휘 1일차",15,"숨마 주니어 어휘력 1"),
    t("calc","수학","연산 (중학연산) 20문제",15),
    t("reading","영어","리딩 책 복습 · 예습 (월요일 수업)",20,"",{hw:true}),
    t("wtest","영어","단어 테스트",10,"다 맞으면 재테스트 없음 · 틀린 단어 10번씩"),
  ]},
  sun:{label:"일",cap:0,events:["교회 10:30","야외 활동 14:00–17:00","가족 시간"],tasks:[
    t("freelog","학교","자유 독서록 (저녁)",20),
    t("wtest2","영어","단어테스트 2차 (저녁)",10,"틀린 단어 10번씩"),
  ]},
};
const ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
const DAILY_BOOK = t("book","기본","책 읽기",0,"하루 마무리");

const TAGS = ["국어","수학","영어","사회","과학","학교","기본","엘리하이"];
const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ---- 날짜 ----
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;}
const today = new Date();
let weekStart = mondayOf(today);
let sel = ORDER[(today.getDay()+6)%7];

// ---- 상태 ----
// config/plan = {days:{mon:{label,cap,events,tasks}}}  (편집: 부모만)
// weeks/<월요일날짜> = {checks:{mon:{id:true}}, hw:{"mon_id":"..."}}
let plan = clone(DEFAULT_PLAN);
let draft = null, dirty = false, confirmReset = false;
let state = {checks:{},hw:{}};
let db = null, user = null, canEditPlan = false, unsub = null, writeTimer = null, writing = Promise.resolve(), readOnly = false;
const LS = k => "hajun-check:"+k;
const weekKey = () => ymd(weekStart);
const status = msg => document.getElementById("status").textContent = msg;
const isEdit = () => location.hash === "#edit" && canEditPlan;

function lsGet(k){try{const v=localStorage.getItem(LS(k));return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS(k),JSON.stringify(v))}catch(e){}}

function validPlan(p){return p && ORDER.every(k=>p[k] && Array.isArray(p[k].tasks))}

function subscribeWeek(){
  if(unsub){unsub();unsub=null}
  state = {checks:{},hw:{}};
  if(!db){state = lsGet(weekKey())||state; render(); return}
  render();
  let timer = setTimeout(()=>status("저장소에 아직 연결하지 못했어요. 체크는 이 기기에만 임시로 보여요."),10000);
  unsub = db.doc("weeks/"+weekKey()).onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);status(readOnly?"보기 전용이에요.":"체크하면 자동으로 저장돼요. 엄마·아빠도 같은 화면을 봐요.")}
    if(snap.metadata.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null;
    const next = {checks:clone(d?.checks||{}),hw:{...(d?.hw||{})}};
    const active = document.activeElement;
    const typing = active && active.classList.contains("hw");
    if(typing) next.hw[active.dataset.key] = state.hw[active.dataset.key] || "";
    if(JSON.stringify(next)===JSON.stringify(state)) return;
    state = next;
    if(!typing && !isEdit()) render();
  },()=>{clearTimeout(timer);status("저장소 연결이 끊겼어요. 새로고침해 주세요.")});
}

function subscribePlan(){
  if(!db){const p=lsGet("plan"); if(validPlan(p)) plan=p; return}
  db.doc("config/plan").onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return;
    const p = snap.exists ? snap.data()?.days : null;
    plan = validPlan(p) ? clone(p) : clone(DEFAULT_PLAN);
    if(!(isEdit() && dirty)) { draft = null; render(); }
  },()=>{});
}

function saveWeek(){
  lsSet(weekKey(),state);
  if(!db||readOnly) return;
  clearTimeout(writeTimer);
  const key = weekKey(), body = clone(state);
  writeTimer = setTimeout(()=>{
    writing = writing.then(()=>db.doc("weeks/"+key).set({...body,updated:new Date().toISOString()}))
      .catch(e=>{ if(e&&e.code==="invalid_argument"){readOnly=true;status("보기 전용이라 체크가 저장되지 않아요.")} else status("저장하지 못했어요. 잠시 뒤 다시 체크해 주세요."); });
  },400);
}

async function savePlan(){
  const p = clone(draft);
  ORDER.forEach(k=>{ p[k].tasks = p[k].tasks.filter(x=>x.name.trim()).map(x=>({...x,name:x.name.trim(),note:(x.note||"").trim(),min:Math.max(0,parseInt(x.min)||0)})); });
  if(!db){ lsSet("plan",p); plan=p; dirty=false; draft=null; status("이 기기에 저장했어요."); render(); return; }
  status("저장 중…");
  try{
    await db.doc("config/plan").set({days:p,updated:new Date().toISOString()});
    plan=p; dirty=false; draft=null; status("저장했어요. 하준이 체크리스트에 바로 반영돼요."); render();
  }catch(e){ status(e&&e.code==="invalid_argument" ? "할 일을 고칠 권한이 없어요. 페이지 주인(편집자)만 저장할 수 있어요." : "저장하지 못했어요. 잠시 뒤 다시 눌러 주세요."); }
}

// ---- 공통 ----
function dayStats(k){
  const p = plan[k], c = state.checks[k]||{};
  const total = p.tasks.length, done = p.tasks.filter(x=>c[x.id]).length;
  const minTotal = p.tasks.reduce((s,x)=>s+(+x.min||0),0), minDone = p.tasks.filter(x=>c[x.id]).reduce((s,x)=>s+(+x.min||0),0);
  return {total,done,minTotal,minDone};
}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

function render(){
  const edit = isEdit();
  if(edit && !draft){ draft = clone(plan); dirty=false; }
  document.getElementById("title").textContent = edit ? "할 일 편집" : "하준이 공부 체크";
  document.getElementById("weeknav").hidden = edit;
  document.getElementById("legend").hidden = edit;
  const mb = document.getElementById("modeBtn");
  mb.hidden = !canEditPlan;
  mb.textContent = edit ? "체크리스트로" : "할 일 편집";
  mb.href = edit ? "#" : "#edit";

  const end = new Date(weekStart); end.setDate(end.getDate()+6);
  document.getElementById("weekLabel").textContent = `${weekStart.getMonth()+1}/${weekStart.getDate()} – ${end.getMonth()+1}/${end.getDate()}`;
  const daysEl = document.getElementById("days"); daysEl.textContent = "";
  const src = edit ? draft : plan;
  ORDER.forEach((k,i)=>{
    const d = new Date(weekStart); d.setDate(d.getDate()+i);
    const b = el("button","day"+(ymd(d)===ymd(today)?" today":"")+(k==="sun"?" sun":""));
    b.setAttribute("aria-pressed", k===sel);
    if(edit){
      const n = src[k].tasks.length;
      b.setAttribute("aria-label", `${src[k].label}요일 할 일 ${n}개`);
      b.innerHTML = `<span class="d">${src[k].label}</span><span class="n">${n}개</span>`;
    } else {
      const s = dayStats(k);
      b.setAttribute("aria-label", `${src[k].label}요일 ${s.done}/${s.total} 완료`);
      b.innerHTML = `<span class="d">${src[k].label}</span><span class="n">${d.getMonth()+1}/${d.getDate()}</span><span class="bar"><i style="width:${s.total?Math.round(s.done/s.total*100):0}%"></i></span>`;
    }
    b.onclick = ()=>{sel=k;render()};
    daysEl.appendChild(b);
  });
  edit ? renderEditor() : renderChecklist();
}

// ---- 체크리스트 ----
function renderChecklist(){
  const p = plan[sel], c = state.checks[sel]||{}, s = dayStats(sel);
  const sheet = document.getElementById("sheet"); sheet.textContent = "";
  const head = el("div","sheet-head");
  const capTxt = sel==="sun" ? "가족 시간 · 저녁 보강만" : `공부 시간 ${p.cap}분${sel==="sat"?" 이상":""}`;
  head.innerHTML = `<div class="sheet-title"><h2>${p.label}요일</h2><span class="sum"><b>${s.done}</b> / ${s.total} 완료 · ${s.minDone}분 / 약 ${s.minTotal}분 · ${capTxt}</span></div>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.done}"><i style="width:${s.total?s.done/s.total*100:0}%"></i></div>`;
  const evs = el("div","events");
  (p.events||[]).forEach(e=>evs.appendChild(el("span","ev",e)));
  head.appendChild(evs); sheet.appendChild(head);

  const ul = el("ul");
  p.tasks.forEach(x=>ul.appendChild(row(x,c)));
  sheet.appendChild(ul);
  sheet.appendChild(el("div","group","매일"));
  const ul2 = el("ul"); ul2.appendChild(row(DAILY_BOOK,c)); sheet.appendChild(ul2);

  if(s.total && s.done===s.total){
    const r=el("div","rest"); r.innerHTML="<strong>오늘 할 일 끝!</strong>수고했어, 하준아."; sheet.appendChild(r);
  }
}

function row(x,c){
  const li = el("li","task"+(c[x.id]?" done":""));
  const cb = document.createElement("input"); cb.type="checkbox"; cb.id=`cb-${sel}-${x.id}`; cb.checked=!!c[x.id];
  cb.onchange = ()=>{
    const m = state.checks[sel] = {...(state.checks[sel]||{})};
    if(cb.checked) m[x.id]=true; else delete m[x.id];
    saveWeek(); render();
  };
  const body = el("div","tbody");
  const line = el("label","tline"); line.htmlFor=cb.id;
  const tag = el("span","tag",x.tag); tag.style.setProperty("--c",`var(${C[x.tag]||"--etc"})`);
  line.append(tag, el("span","tname",x.name)); body.appendChild(line);
  if(x.note) body.appendChild(el("span","tnote",x.note));
  if(x.hw){
    const key = `${sel}_${x.id}`;
    const ta=el("textarea","hw"); ta.id=`hw-${key}`; ta.dataset.key=key; ta.rows=1;
    ta.placeholder="숙제 내용 적기 (예: 3800제 p.24–27, 리딩 Unit 5)"; ta.value=state.hw[key]||"";
    ta.setAttribute("aria-label",`${x.name} 숙제 내용`);
    ta.oninput=()=>{state.hw={...state.hw,[key]:ta.value};saveWeek()};
    body.appendChild(ta);
  }
  li.append(cb, body, el("span","min", x.min?`${x.min}분`:""));
  return li;
}

// ---- 편집 ----
function markDirty(){ if(!dirty){dirty=true; const d=document.getElementById("dirtyNote"); if(d) d.hidden=false; const sb=document.getElementById("saveBtn"); if(sb) sb.disabled=false;} }

function renderEditor(){
  const p = draft[sel];
  const sheet = document.getElementById("sheet"); sheet.textContent = "";

  const top = el("div","ed-section");
  const t1 = el("div","sheet-title"); t1.appendChild(el("h2",null,`${p.label}요일`));
  const tot = p.tasks.reduce((s,x)=>s+(parseInt(x.min)||0),0);
  t1.appendChild(el("span","sum",`할 일 ${p.tasks.length}개 · 약 ${tot}분`)); top.appendChild(t1);

  const capRow = el("div","ed-row");
  const capL = el("label","lbl","하루 공부 가능 시간(분)"); capL.htmlFor="ed-cap";
  const cap = el("input","inp num"); cap.id="ed-cap"; cap.type="number"; cap.min="0"; cap.step="10"; cap.value=p.cap;
  cap.oninput=()=>{p.cap=Math.max(0,parseInt(cap.value)||0); markDirty()};
  capRow.append(capL,cap); top.appendChild(capRow);

  const evL = el("label","lbl","고정 일정 (한 줄에 하나)"); evL.htmlFor="ed-events";
  const ev = el("textarea","inp"); ev.id="ed-events"; ev.rows=3; ev.value=(p.events||[]).join("\n");
  ev.oninput=()=>{p.events=ev.value.split("\n").map(s=>s.trim()).filter(Boolean); markDirty()};
  top.append(evL,ev);
  sheet.appendChild(top);

  sheet.appendChild(el("div","group","할 일 (위에서부터 순서대로 보여요)"));
  const ul = el("ul");
  p.tasks.forEach((x,i)=>ul.appendChild(edRow(p,x,i)));
  sheet.appendChild(ul);

  const add = el("div","ed-section");
  const addBtn = el("button","btn","+ 할 일 추가");
  addBtn.onclick=()=>{ const x={id:newId(),tag:"수학",name:"",min:15,note:""}; p.tasks.push(x); markDirty(); render(); const inp=document.getElementById(`ed-name-${x.id}`); if(inp) inp.focus(); };
  add.appendChild(addBtn); sheet.appendChild(add);

  const foot = el("div","ed-foot");
  const left = el("div","ed-row");
  const save = el("button","btn primary","저장"); save.id="saveBtn"; save.disabled=!dirty; save.onclick=savePlan;
  const cancel = el("button","btn","되돌리기"); cancel.onclick=()=>{draft=null;dirty=false;confirmReset=false;status("저장된 내용으로 되돌렸어요.");render()};
  const dn = el("span","dirty","저장하지 않은 변경이 있어요"); dn.id="dirtyNote"; dn.hidden=!dirty;
  left.append(save,cancel,dn);
  const right = el("div","ed-row");
  if(confirmReset){
    const cf = el("span","confirm","처음 배치안으로 바꿀까요? (저장해야 반영)");
    const yes = el("button","btn danger","바꾸기"); yes.onclick=()=>{draft=clone(DEFAULT_PLAN);confirmReset=false;dirty=true;render()};
    const no = el("button","btn","취소"); no.onclick=()=>{confirmReset=false;render()};
    right.append(cf,yes,no);
  } else {
    const rs = el("button","btn danger","처음 배치안으로"); rs.onclick=()=>{confirmReset=true;render()};
    right.appendChild(rs);
  }
  foot.append(left,right); sheet.appendChild(foot);
}

function edRow(p,x,i){
  const li = el("li","edtask");
  const r1 = el("div","ed-row");
  const tag = el("select","inp"); tag.id=`ed-tag-${x.id}`; tag.setAttribute("aria-label","과목");
  TAGS.forEach(tg=>{const o=el("option",null,tg);o.value=tg;if(tg===x.tag)o.selected=true;tag.appendChild(o)});
  tag.onchange=()=>{x.tag=tag.value;markDirty()};
  const name = el("input","inp grow"); name.id=`ed-name-${x.id}`; name.value=x.name; name.placeholder="할 일 이름 (예: 연산 20문제)"; name.setAttribute("aria-label","할 일 이름");
  name.oninput=()=>{x.name=name.value;markDirty()};
  r1.append(tag,name);

  const r2 = el("div","ed-row");
  const min = el("input","inp num"); min.id=`ed-min-${x.id}`; min.type="number"; min.min="0"; min.step="5"; min.value=x.min; min.setAttribute("aria-label","예상 시간(분)");
  min.oninput=()=>{x.min=Math.max(0,parseInt(min.value)||0);markDirty()};
  const note = el("input","inp grow"); note.id=`ed-note-${x.id}`; note.value=x.note||""; note.placeholder="메모 (교재, 주의할 점)"; note.setAttribute("aria-label","메모");
  note.oninput=()=>{x.note=note.value;markDirty()};
  r2.append(min, el("span","chk","분"), note);

  const r3 = el("div","ed-row");
  const hwL = el("label","chk"); const hw = el("input"); hw.type="checkbox"; hw.id=`ed-hw-${x.id}`; hw.checked=!!x.hw;
  hw.onchange=()=>{ if(hw.checked) x.hw=true; else delete x.hw; markDirty(); };
  hwL.append(hw, document.createTextNode("숙제 메모 칸 보이기"));
  const up = el("button","mini","↑"); up.setAttribute("aria-label","위로"); up.disabled=i===0;
  up.onclick=()=>{[p.tasks[i-1],p.tasks[i]]=[p.tasks[i],p.tasks[i-1]];markDirty();render()};
  const down = el("button","mini","↓"); down.setAttribute("aria-label","아래로"); down.disabled=i===p.tasks.length-1;
  down.onclick=()=>{[p.tasks[i+1],p.tasks[i]]=[p.tasks[i],p.tasks[i+1]];markDirty();render()};
  const del = el("button","mini del","삭제"); del.onclick=()=>{p.tasks.splice(i,1);markDirty();render()};
  r3.append(hwL, el("span","spacer"), up, down, del);

  li.append(r1,r2,r3);
  return li;
}

// ---- 이벤트 ----
document.getElementById("prevWeek").onclick=()=>{weekStart.setDate(weekStart.getDate()-7);subscribeWeek()};
document.getElementById("nextWeek").onclick=()=>{weekStart.setDate(weekStart.getDate()+7);subscribeWeek()};
window.addEventListener("hashchange",()=>{ if(location.hash!=="#edit"){draft=null;dirty=false;confirmReset=false;} render(); });

render();
(async()=>{
  try{ db = window.claude?.use ? await window.claude.use("db") : null }catch(e){ db=null }
  try{ user = window.claude?.use ? await window.claude.use("user") : null }catch(e){ user=null }
  canEditPlan = db ? !!(user && user.canEdit && await user.canEdit()) : true;
  if(!db) status("이 화면에서는 체크와 편집 내용이 이 기기에만 저장돼요.");
  subscribePlan();
  subscribeWeek();
})();
</script>
